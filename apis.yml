aid: hostie
name: Hostie
description: >-
  Hostie is an AI-powered virtual concierge for restaurants that answers every
  call, text, email, and message in the restaurant's own voice so operators
  never miss a guest and staff can stay focused on in-room service. The
  conversational AI platform handles phone volume, captures reservations and
  takeout orders, fields private-event inquiries, and unifies guest
  communication across calls, texts, emails, Instagram, and Google Maps, with
  live call transcripts, multilingual support (20 languages), guest history,
  and data ownership. Restaurant partners include Tonchin, Trader Vic's, Flour +
  Water, The Slanted Door Group, and The Stinking Rose Group. Hostie raised a
  $12M Series A led by Obvious Ventures (July 2026), bringing total funding to
  $16M. Hostie is a business SaaS product and does not currently publish a
  public API, SDKs, or developer documentation; this profile is maintained in
  the API Evangelist network for company/portfolio tracking.
